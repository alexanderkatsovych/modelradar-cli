name: 'ModelRadar — LLM deprecation check'
description: 'Fail the build when your code uses an LLM model scheduled for retirement.'
author: 'ModelRadar'
branding:
  icon: 'radio'
  color: 'blue'
inputs:
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
  max-days:
    description: 'Fail if a used model retires within this many days'
    required: false
    default: '90'
  strict:
    description: 'Also fail on deprecated models with no imminent retirement'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: ModelRadar scan
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/bin/modelradar.js" scan "${{ inputs.path }}" \
          --max-days=${{ inputs.max-days }} ${{ inputs.strict == 'true' && '--strict' || '' }}
